name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, runner: windows-latest, os: windows, arch: x86_64, experimental: false }
          - { name: linux-x86_64, runner: ubuntu-22.04, os: linux, arch: x86_64, experimental: false }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, os: linux, arch: aarch64, experimental: false }
          - { name: windows-aarch64, runner: windows-11-arm, os: windows, arch: aarch64, experimental: true }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Check tag matches Cargo.toml version
        shell: bash
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          ver=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml | head -n1)
          if [ "v$ver" != "$TAG" ]; then
            echo "::error::tag $TAG does not match workspace version v$ver in Cargo.toml"
            exit 1
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}
      - name: Install Linux build libraries
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libx11-dev libvulkan-dev
      - run: cargo build --release --locked -p viewer -p tools
      - name: Package
        shell: bash
        run: |
          name="j2k-viewer-${VERSION}-${{ matrix.name }}"
          mkdir -p "pkg/$name" out
          if [ "${{ matrix.os }}" = windows ]; then
            cp target/release/viewer.exe target/release/tools.exe "pkg/$name/"
          else
            cp target/release/viewer target/release/tools "pkg/$name/"
          fi
          cp LICENSE-MIT LICENSE-APACHE README.md "pkg/$name/"
          if [ "${{ matrix.os }}" = windows ]; then
            pwsh -NoProfile -Command "Compress-Archive -Path 'pkg/$name' -DestinationPath 'out/$name.zip'"
          else
            tar -C pkg -czf "out/$name.tar.gz" "$name"
          fi
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
      # Windows setup.exe (installer + uninstaller + file-type registration), built with Inno Setup
      # from the binaries just compiled. For the best-effort ARM build this step may fail without
      # blocking the release; for x86_64 a failure fails the job.
      - name: Install Inno Setup if the runner lacks it
        if: matrix.os == 'windows'
        continue-on-error: ${{ matrix.experimental }}
        shell: pwsh
        run: |
          $found = (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -or
                   (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -or
                   (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not $found) { choco install innosetup --no-progress -y; if ($LASTEXITCODE -ne 0) { throw 'choco install innosetup failed' } }
      - name: Build Windows installer
        if: matrix.os == 'windows'
        continue-on-error: ${{ matrix.experimental }}
        shell: pwsh
        run: ./scripts/build-installer.ps1 -NoBuild -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows'
        with:
          name: package-installer-${{ matrix.name }}
          path: dist/*-setup.exe
          if-no-files-found: ${{ matrix.experimental && 'ignore' || 'error' }}

  release:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: package-*
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          cat > notes-header.md <<'EOF'
          ## Install

          **Windows:** download `j2k-viewer-<version>-windows-x86_64-setup.exe` and run it. It installs
          for your user account only (no administrator prompt), adds a Start menu entry, and makes
          j2k viewer available under "Open with" for JPEG 2000 files; Windows asks you to confirm
          it as the default app. Uninstall it from Settings > Apps. A portable `.zip` (just extract and
          run `viewer.exe`) is also provided. The ARM64 files are best-effort.

          **Linux:** download the `.tar.gz` for your CPU, extract it and run `./viewer`. It needs a
          Vulkan driver (`libvulkan1` plus a GPU driver, or `mesa-vulkan-drivers` for software
          rendering) and an XDG desktop portal for the Open dialog.

          The Windows programs are unsigned, so SmartScreen may warn on first run. Verify downloads
          against `SHA256SUMS.txt`. See the README for controls and requirements.

          ## Changes

          EOF
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" artifacts/* --title "$TAG" --verify-tag --generate-notes --notes-file notes-header.md "${flags[@]}"
