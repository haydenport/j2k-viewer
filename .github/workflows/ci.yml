name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libx11-dev libvulkan-dev
      - run: cargo fmt --all --check
      - run: cargo build --locked
      - run: cargo test --workspace --locked
      - name: Smoke test (software Vulkan, pixel-exact)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
          cargo build --release --locked -p viewer -p tools
          scripts/smoke.sh target/release/viewer target/release/tools
